# BlockChainT - Production Nginx Configuration (HTTP & Standalone Mode)
# Optimized for LockTrace Mainnet & Space (Decentralized Neobank)

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=40r/s;
limit_req_zone $binary_remote_addr zone=wallet:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name locktrace.space www.locktrace.space _;

    root /opt/blockchaint/frontend;
    index index.html;

    # Security & PWA headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # Modern Web3 & PWA CSP (Restricted origins, unsafe-eval removed, strict connect-src)
    add_header Content-Security-Policy "default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com; connect-src 'self' https://locktrace.space https://www.locktrace.space https://mainnet.base.org https://basescan.org https://*.rpc.thirdweb.com https://*.thirdweb.com wss://*.thirdweb.com https://api.coinbase.com https://api.geckoterminal.com https://api.dexscreener.com; font-src 'self' https: data:; img-src 'self' data: https: blob:; style-src 'self' 'unsafe-inline' https:; object-src 'none'; base-uri 'self';" always;

    # High performance Gzip
    gzip on;
    gzip_types application/json text/plain text/css application/javascript application/manifest+json image/svg+xml;
    gzip_min_length 256;

    # ACME Challenge for Certbot SSL
    location /.well-known/acme-challenge/ {
        root /opt/blockchaint/frontend;
        allow all;
    }

    # API Proxy to Gunicorn
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 5m;
    }

    # Wallet generation rate limit (AUD14-06 Hardened with strict body limit and timeouts)
    location /api/v1/wallet/create {
        limit_req zone=wallet burst=10 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        client_max_body_size 1m;
    }

    # Direct Node Script Download for Community Miners
    location = /node_runner.py {
        alias /opt/blockchaint/node_runner.py;
        add_header Content-Type "text/x-python";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Health check
    location /health {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:5000/api/v1/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service Worker caching rules
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Static PWA Files
    location / {
        try_files $uri $uri/ /index.html;
    }
}

