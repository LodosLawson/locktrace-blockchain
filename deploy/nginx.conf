# BlockChainT - Nginx Yapılandırması

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=wallet:10m rate=2r/s;

server {
    listen 80;
    server_name _;

    # Güvenlik başlıkları
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ACME Challenge for Certbot SSL
    location /.well-known/acme-challenge/ {
        root /opt/blockchaint/frontend;
        allow all;
    }

    # Unconditional HTTPS Redirect
    location / {
        return 301 https://www.locktrace.space$request_uri;
    }
}

