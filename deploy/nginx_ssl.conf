# BlockChainT - Production Nginx Configuration with SSL
# Optimized for LockTrace Mainnet & Space (Decentralized Neobank)

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=40r/s;
limit_req_zone $binary_remote_addr zone=wallet:10m rate=5r/s;

# HTTP - Port 80
server {
    listen 80;
    listen [::]:80;
    server_name locktrace.space www.locktrace.space 129.151.205.219 _;

    root /opt/blockchaint/frontend;
    index index.html;

    # ACME Challenge for Certbot SSL
    location /.well-known/acme-challenge/ {
        root /opt/blockchaint/frontend;
        allow all;
    }

    # API Proxy for direct IP or HTTP requests
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 5m;
    }

    # Direct Node Script Download
    location /node_runner.py {
        alias /opt/blockchaint/node_runner.py;
        add_header Content-Type "text/x-python";
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:5000/api/v1/health;
        proxy_set_header Host $host;
    }

    location / {
        # Redirect domain visitors to HTTPS
        if ($host ~* "locktrace\.space") {
            return 301 https://www.locktrace.space$request_uri;
        }
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS - Port 443 with Let's Encrypt SSL
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name locktrace.space www.locktrace.space;

    ssl_certificate /etc/letsencrypt/live/www.locktrace.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.locktrace.space/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /opt/blockchaint/frontend;
    index index.html;

    # Security & PWA headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    
    # Modern Web3 & PWA CSP (Permits fonts, Tailwind CDN, QR scanning & Thirdweb RPCs)
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data: blob:; connect-src 'self' https: wss:; font-src 'self' https: data:; img-src 'self' data: https: blob:; style-src 'self' 'unsafe-inline' https:; object-src 'none'; base-uri 'self';" always;

    # High performance Gzip
    gzip on;
    gzip_types application/json text/plain text/css application/javascript application/manifest+json image/svg+xml;
    gzip_min_length 256;

    # ACME Challenge for renewal
    location /.well-known/acme-challenge/ {
        root /opt/blockchaint/frontend;
        allow all;
    }

    # API Proxy to Gunicorn
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        client_max_body_size 5m;
    }

    # Cüzdan oluşturma
    location /api/v1/wallet/create {
        limit_req zone=wallet burst=10 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Direct Node Script Download for Community Miners
    location /node_runner.py {
        alias /opt/blockchaint/node_runner.py;
        add_header Content-Type "text/x-python";
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:5000/api/v1/health;
        proxy_set_header Host $host;
    }

    # Service Worker must never be stale-cached by browsers
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Static PWA Files
    location ~* \.(manifest|json|webmanifest)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    location ~* \.(svg|png|jpg|jpeg|gif|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
